<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkforceIQ - Resource Planning & Analytics</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-layout">
        <!-- Collapsible Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo" style="font-size: 1.15rem;">
                    <div class="brand-icon" style="width: 28px; height: 28px;"><i data-lucide="layers"></i></div>
                    <span class="logo-text">Workforce<span style="color: var(--primary-color);">IQ</span></span>
                </div>
                <button class="btn btn-secondary btn-sm" id="toggle-sidebar-btn" style="padding: 4px 8px;">
                    <i data-lucide="chevron-left" id="sidebar-icon"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-item active" data-view="dashboard">
                    <i data-lucide="layout-dashboard"></i> <span>Dashboard</span>
                </div>
                <div class="nav-item" data-view="employees">
                    <i data-lucide="users"></i> <span>Employees</span>
                </div>
                <div class="nav-item" data-view="projects">
                    <i data-lucide="briefcase"></i> <span>Projects</span>
                </div>
                <div class="nav-item" data-view="planner">
                    <i data-lucide="calendar"></i> <span>Allocation Planner</span>
                </div>
                <div class="nav-item" data-view="analytics">
                    <i data-lucide="bar-chart-3"></i> <span>Analytics</span>
                </div>
                <div class="nav-item" data-view="reports">
                    <i data-lucide="file-text"></i> <span>Reports & Export</span>
                </div>
                <div class="nav-item admin-only" data-view="admin" style="display: none;">
                    <i data-lucide="shield"></i> <span>Admin & Audit Log</span>
                </div>
            </nav>

            <div style="padding: 16px; border-top: 1px solid var(--border-color);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/notionists/svg?seed=Admin" class="avatar" alt="Avatar">
                    <div style="min-width: 0; flex: 1;" class="logo-text">
                        <div id="user-name-display" style="font-weight: 700; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Admin User</div>
                        <div id="user-role-display" style="font-size: 0.75rem; color: var(--text-muted);">Admin Role</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Workspace Area -->
        <div class="main-wrapper">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-search" id="cmd-k-trigger" title="Press Ctrl+K to open Quick Search">
                    <i data-lucide="search" style="width: 16px; color: var(--text-muted);"></i>
                    <span>Quick Search or Command (Ctrl + K)</span>
                </div>

                <div class="topbar-actions">
                    <button class="btn btn-secondary btn-sm" id="app-theme-btn" title="Toggle Theme">
                        <i data-lucide="moon"></i>
                    </button>
                    <button class="btn btn-secondary btn-sm" id="logout-btn">
                        <i data-lucide="log-out"></i> Logout
                    </button>
                </div>
            </header>

            <!-- Main Content Container -->
            <main class="app-content" id="view-container">
                <!-- Views loaded dynamically by app.js -->
            </main>
        </div>
    </div>

    <!-- Command Palette Modal (Ctrl+K) -->
    <div class="command-palette-backdrop" id="command-modal">
        <div class="command-palette">
            <div class="command-input-wrapper">
                <i data-lucide="search"></i>
                <input type="text" id="cmd-input" class="command-input" placeholder="Type to search employees, projects, or pages...">
            </div>
            <div class="command-results" id="cmd-results">
                <!-- Search Results populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Slide-over Drawer for Employee Profile & Candidate Suggestions -->
    <div class="drawer-backdrop" id="drawer-backdrop">
        <div class="drawer" id="drawer-content">
            <!-- Populated dynamically -->
        </div>
    </div>

    <!-- Generic Modal Dialog Backdrop -->
    <div class="modal-backdrop" id="generic-modal-backdrop" style="position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px;">
        <div class="card" id="generic-modal-box" style="width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; background: var(--bg-surface); padding: 28px; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl);">
            <!-- Modal Content Inject -->
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
